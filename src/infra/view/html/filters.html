<div class="filter-row">
  <button class="filter-chip" id="btnShowFavorites" title="Favorites">
    <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor">
      <path
        d="M8 0L10.5 5.5L16 6.5L12 10.5L13 16L8 13.5L3 16L4 10.5L0 6.5L5.5 5.5L8 0Z"
      />
    </svg>
    <span class="filter-chip-label">Favorites</span>
  </button>
  <button
    class="filter-chip"
    id="btnShowTimeUpdated"
    title="Show last updated time"
  >
    <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor">
      <path
        d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8.75-3.25a.75.75 0 0 0-1.5 0v3.5c0 .192.168.1.5.75H11a.75.75 0 0 0 0-1.5H8.75V4.75z"
      />
    </svg>
    <span class="filter-chip-label">Updated</span>
  </button>
  <select class="sort-select" id="sortSelect" title="Sort workspaces">
    <option value="favorites">Favorites First</option>
    <option value="recent">Recent</option>
    <option value="alphabetical">A-Z</option>
  </select>
</div>
