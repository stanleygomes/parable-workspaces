<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Export Workspaces - Parable</title>
    <style nonce="{{nonce}}">
      {{style}}
    </style>
  </head>
  <body>
    <div class="backup-container">
      <div class="backup-header">
        <h1 class="backup-title">Export & Backup</h1>
        <p class="backup-subtitle">
          Export your workspaces to .code-workspace files or import existing
          ones.
        </p>
      </div>

      <div class="action-bar">
        <button class="primary-btn" id="btnImport">
          Import .code-workspace
        </button>
      </div>

      <div class="workspaces-export-list" id="workspacesList">
        <div class="loading">Loading workspaces...</div>
      </div>

      <div class="backup-footer">
        <h3>Local Data Path</h3>
        <p>Your local configuration and cache are stored at:</p>
        <code class="folder-path">{{workspaceDir}}</code>
      </div>
    </div>

    <script nonce="{{nonce}}">
      const vscode = acquireVsCodeApi();
      const workspacesList = document.getElementById('workspacesList');

      document.getElementById('btnImport').addEventListener('click', () => {
        vscode.postMessage({ command: 'import' });
      });

      window.addEventListener('message', (event) => {
        const message = event.data;
        if (message.command === 'updateWorkspaces') {
          renderWorkspaces(message.workspaces);
        }
      });

      function renderWorkspaces(workspaces) {
        if (workspaces.length === 0) {
          workspacesList.innerHTML =
            '<p class="empty-msg">No workspaces to export.</p>';
          return;
        }

        workspacesList.innerHTML = workspaces
          .map(
            (ws) => `
          <div class="export-item">
            <div class="export-info">
              <span class="export-name">${escapeHtml(ws.name)}</span>
              <span class="export-path">${escapeHtml(ws.folders[0] || '')}</span>
            </div>
            <button class="secondary-btn btn-export" data-id="${ws.id}">Export</button>
          </div>
        `,
          )
          .join('');

        workspacesList.querySelectorAll('.btn-export').forEach((btn) => {
          btn.addEventListener('click', () => {
            vscode.postMessage({
              command: 'export',
              workspaceId: btn.dataset.id,
            });
          });
        });
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Tell the extension we are ready to receive data
      vscode.postMessage({ command: 'ready' });
    </script>
  </body>
</html>
