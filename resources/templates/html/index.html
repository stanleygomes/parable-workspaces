<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parable Workspaces</title>
    <style nonce="{{nonce}}">
      {{style}}
    </style>
  </head>
  <body>
    <div class="toolbar">
      <input
        class="search-box"
        id="searchBox"
        type="text"
        placeholder="Search workspaces..."
      />
    </div>

    
    <div class="workspaces-list" id="workspacesList"></div>
    <div class="context-menu" id="contextMenu"></div>

    <script nonce="{{nonce}}">
      const vscode = acquireVsCodeApi();
      let currentWorkspaceId = null;

      const searchBox = document.getElementById('searchBox');
      const workspacesList = document.getElementById('workspacesList');
      const contextMenu = document.getElementById('contextMenu');
      searchBox.addEventListener('input', () => {
        vscode.postMessage({ command: 'search', query: searchBox.value });
      });

      document.addEventListener('click', (e) => {

        if (!contextMenu.contains(e.target)) {
          contextMenu.style.display = 'none';
        }
      });

      function renderWorkspaces(workspaces) {
        if (workspaces.length === 0) {
          workspacesList.innerHTML = `
          <div class="empty-state">
            <p>No workspaces saved yet.</p>
            <button class="primary-btn" id="btnSaveCurrent">Save Current Workspace</button>
          </div>
        `;
          document
            .getElementById('btnSaveCurrent')
            .addEventListener('click', () => {
              vscode.postMessage({ command: 'saveCurrent' });
            });
          return;
        }

        workspacesList.innerHTML = workspaces
          .map((ws) => {
            const colorStyle = ws.color ? `border-left: 4px solid ${ws.color};` : '';
            return `
          <div class="workspace-item" data-id="${ws.id}" style="${colorStyle}">
            <div class="workspace-body">
              <div class="workspace-header">
                <span class="workspace-title">${escapeHtml(ws.name)}</span>
                <span class="workspace-date">${ws.dateLabel}</span>
              </div>
              <div class="workspace-info">
                <span class="workspace-folders">${ws.foldersCount} folder(s)</span>
              </div>

              ${ws.tags && ws.tags.length > 0 ? `
                <div class="workspace-tags">
                  ${ws.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;
          })
          .join('');

        workspacesList.querySelectorAll('.workspace-item').forEach((item) => {
          item.addEventListener('click', (e) => {
            vscode.postMessage({
              command: 'openWorkspace',
              workspaceId: item.dataset.id,
            });
          });
          item.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showContextMenu(e.clientX, e.clientY, item.dataset.id);
          });
        });
      }

      function showContextMenu(x, y, workspaceId) {
        currentWorkspaceId = workspaceId;
        contextMenu.innerHTML = `
        <div class="context-menu-item" data-action="openWorkspace">Open Workspace</div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" data-action="editWorkspace">Edit</div>
        <div class="context-menu-item" data-action="deleteWorkspace">Delete</div>
      `;
        contextMenu.style.left = x + 'px';
        contextMenu.style.top = y + 'px';
        contextMenu.style.display = 'block';

        contextMenu.querySelectorAll('.context-menu-item').forEach((item) => {
          item.addEventListener('click', () => {
            const action = item.getAttribute('data-action');
            vscode.postMessage({ command: action, workspaceId: currentWorkspaceId });
            contextMenu.style.display = 'none';
          });
        });
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      window.addEventListener('message', (event) => {
        const message = event.data;
        if (message.command === 'updateWorkspaces') {
          renderWorkspaces(message.workspaces);
        }
      });
    </script>
  </body>
</html>
